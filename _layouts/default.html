<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }} | {{ site.title }}</title>
  <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  <style>
    .site-nav {
      background: #111827;
      background: linear-gradient(120deg, #111827, #312e81);
      box-shadow: 0 1px 8px rgba(0, 0, 0, 0.12);
    }

    .cryo-et-theme .site-nav {
      background: #159957;
      background: linear-gradient(120deg, #155799, #159957);
    }

    .cryo-et-theme .main-content h1,
    .cryo-et-theme .main-content h2,
    .cryo-et-theme .main-content h3,
    .cryo-et-theme .main-content h4 {
      color: #155799;
    }

    .cryo-et-theme .main-content a {
      color: #159957;
    }

    .cryo-et-theme .main-content a:hover {
      color: #155799;
    }

    .site-nav-inner {
      max-width: 64rem;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
    }

    .site-nav a,
    .site-nav button {
      color: rgba(255, 255, 255, 0.92);
      font: 600 0.95rem/1.2 -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
      text-decoration: none;
    }

    .site-nav a:hover,
    .site-nav button:hover {
      color: #fff;
      text-decoration: underline;
    }

    .site-nav button {
      margin-left: auto;
      padding: 0;
      cursor: pointer;
      background: none;
      border: 0;
    }

    .main-content h1:first-child {
      margin-top: 0;
    }

    .main-content h1,
    .main-content h2,
    .main-content h3,
    .main-content h4 {
      color: #172554;
    }

    .main-content a {
      color: #155799;
    }

    .main-content a:hover {
      color: #4f46e5;
    }

    .main-content h2,
    .main-content h3,
    .main-content h4 {
      scroll-margin-top: 5rem;
    }

    .blog-list {
      padding-left: 1.2rem;
      font-size: 1.1rem;
    }

    .news-card-grid,
    .blog-card-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 1rem;
      margin-top: 0.75rem;
    }

    .news-card,
    .blog-card {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      min-height: 10.5rem;
      padding: 1.15rem 1.25rem;
      color: #26364a;
      text-decoration: none;
      background: linear-gradient(145deg, #ffffff, #f5f7ff);
      border: 1px solid #dce3f3;
      border-radius: 12px;
      box-shadow: 0 8px 22px rgba(31, 41, 55, 0.06);
      transition: transform 160ms ease, border-color 160ms ease, box-shadow 160ms ease;
    }

    .news-card:hover,
    .blog-card:hover {
      color: #1e293b;
      text-decoration: none;
      border-color: #818cf8;
      box-shadow: 0 12px 28px rgba(79, 70, 229, 0.14);
      transform: translateY(-2px);
    }

    .news-card-static:hover {
      color: #26364a;
      border-color: #dce3f3;
      box-shadow: 0 8px 22px rgba(31, 41, 55, 0.06);
      transform: none;
    }

    .news-card strong,
    .blog-card strong {
      color: #172554;
      font-size: 1.12rem;
    }

    .news-card-date,
    .blog-card-kicker {
      color: #4f46e5;
      font: 700 0.76rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .news-card-cta,
    .blog-card-cta {
      margin-top: auto;
      color: #4338ca;
      font-size: 0.88rem;
      font-weight: 700;
    }

    @media (max-width: 640px) {
      .news-card-grid,
      .blog-card-grid {
        grid-template-columns: 1fr;
      }
    }

    figure {
      margin: 1.5rem 0;
      text-align: center;
    }

    figure img {
      max-width: 100%;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 6px;
    }

    figcaption {
      margin-top: 0.5rem;
      color: #606c71;
      font-size: 0.9rem;
      text-align: center;
    }

    .figure-row {
      display: grid;
      grid-template-columns: minmax(0, 0.85fr) minmax(0, 1.75fr);
      gap: 1.25rem;
      align-items: start;
    }

    .figure-row.equal {
      display: block;
    }

    .figure-row figure {
      margin: 1.5rem 0;
      display: flex;
      align-items: center;
      flex-direction: column;
    }

    .figure-row img {
      width: auto;
      max-width: 100%;
      height: 20rem;
      object-fit: contain;
    }

    .figure-row.equal figure {
      margin: 1.5rem auto;
      justify-content: flex-start;
    }

    .figure-row.equal img {
      width: auto;
      max-width: 100%;
      height: auto;
    }

    @media (max-width: 800px) {
      .figure-row {
        grid-template-columns: 1fr;
      }

      .figure-row img,
      .figure-row.equal img {
        height: auto;
      }
    }

    [data-lang] {
      display: none;
    }

    .floating-toc {
      position: fixed;
      top: 5.5rem;
      right: 1rem;
      width: 15rem;
      max-height: calc(100vh - 7rem);
      padding: 1rem;
      overflow: auto;
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #dce6f0;
      border-radius: 8px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      font-size: 0.9rem;
      z-index: 10;
    }

    .floating-toc-title {
      margin: 0 0 0.6rem;
      color: #155799;
      font-weight: 700;
    }

    .floating-toc ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .floating-toc li {
      margin: 0.35rem 0;
      line-height: 1.35;
    }

    .floating-toc a {
      color: #606c71;
      text-decoration: none;
    }

    .floating-toc a:hover {
      color: #4f46e5;
      text-decoration: underline;
    }

    .floating-toc .toc-h3 {
      padding-left: 0.8rem;
    }

    .floating-toc .toc-h4 {
      padding-left: 1.6rem;
      font-size: 0.85rem;
    }

    @media (max-width: 1200px) {
      .floating-toc {
        display: none;
      }
    }

    .resume {
      color: #2b2b2b;
    }

    .resume-header {
      margin-bottom: 2rem;
      text-align: left;
    }

    .resume-header-main {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1.5rem;
      align-items: center;
    }

    .resume-header h1 {
      margin-bottom: 0.4rem;
    }

    .resume-contact {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem 0.75rem;
      color: #606c71;
    }

    .resume-photo {
      width: 8.5rem;
      height: 10.5rem;
      object-fit: cover;
      border: 3px solid #dce6f0;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
    }

    .resume-actions {
      margin-top: 1rem;
    }

    .resume-actions-bottom {
      margin: 2.5rem 0 0;
      padding-top: 1.25rem;
      text-align: center;
      border-top: 1px solid #dce3f3;
    }

    .print-button {
      display: inline-block;
      padding: 0.55rem 0.9rem;
      color: #fff;
      cursor: pointer;
      background: #155799;
      border: 0;
      border-radius: 5px;
      text-decoration: none;
    }

    .main-content .print-button {
      color: #fff;
    }

    .print-button:hover {
      color: #fff;
      text-decoration: none;
      background: #4f46e5;
    }

    .main-content .print-button:hover {
      color: #fff;
    }

    .resume-section {
      margin-top: 1.8rem;
    }

    .resume-section h2 {
      padding-bottom: 0.25rem;
      margin-bottom: 0.9rem;
      border-bottom: 1px solid #dce6f0;
    }

    .resume-entry {
      margin: 1rem 0;
    }

    .resume-entry-header {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 1rem;
      align-items: baseline;
    }

    .resume-entry-title {
      font-weight: 700;
    }

    .resume-entry-meta {
      color: #606c71;
      font-size: 0.95rem;
      white-space: nowrap;
    }

    .resume-label {
      display: inline-block;
      margin-right: 0.35rem;
      font-weight: 700;
    }

    .resume-label-feature {
      color: #155799;
      font-family: Georgia, "Times New Roman", serif;
    }

    .resume-label-contribution {
      color: #4f46e5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    }

    .resume-author-self {
      font-weight: 700;
      text-decoration: underline;
    }

    .resume ul {
      margin-top: 0.45rem;
    }

    .resume-compact-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 0.5rem 1rem;
      padding-left: 0;
      list-style: none;
    }

    @media (max-width: 720px) {
      .resume-header {
        text-align: center;
      }

      .resume-header-main {
        grid-template-columns: 1fr;
      }

      .resume-contact {
        justify-content: center;
      }

      .resume-photo {
        order: -1;
        margin: 0 auto;
      }

      .resume-entry-header,
      .resume-compact-list {
        grid-template-columns: 1fr;
      }

      .resume-entry-meta {
        white-space: normal;
      }
    }

    @media print {
      @page {
        margin: 1.4cm;
      }

      body {
        color: #2b2b2b;
        background: #fff;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .site-nav,
      .floating-toc,
      .resume-actions {
        display: none !important;
      }

      .main-content {
        max-width: none;
        padding: 0;
        margin: 0;
      }

      .resume {
        font-size: 10pt;
        line-height: 1.35;
      }

      .resume-header {
        margin-bottom: 1rem;
      }

      .resume-header-main {
        grid-template-columns: minmax(0, 1fr) auto;
      }

      .resume-photo {
        width: 6.8rem;
        height: 8.4rem;
        box-shadow: none;
      }

      .resume-section {
        break-inside: avoid;
        margin-top: 1rem;
      }

      .resume-section h2 {
        color: #155799;
        border-bottom-color: #4f46e5;
      }

      .resume-entry {
        break-inside: avoid;
        margin: 0.65rem 0;
      }

      .resume-page-break-before {
        break-before: page;
        page-break-before: always;
      }

      a {
        color: #155799;
        text-decoration: none;
      }
    }

    .gpt6-page {
      position: relative;
      overflow: hidden;
      min-height: 62vh;
      padding: clamp(2rem, 7vw, 5.5rem) clamp(1.25rem, 5vw, 4rem);
      color: #e5e7eb;
      background: #0b1020;
      border: 1px solid #27345c;
      border-radius: 18px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.22);
      isolation: isolate;
    }

    .gpt6-page::before,
    .gpt6-page::after {
      position: absolute;
      z-index: -1;
      width: 18rem;
      height: 18rem;
      content: "";
      border-radius: 50%;
      filter: blur(8px);
      opacity: 0.34;
    }

    .gpt6-page::before {
      top: -9rem;
      right: -4rem;
      background: radial-gradient(circle, #2563eb 0%, transparent 68%);
    }

    .gpt6-page::after {
      bottom: -10rem;
      left: -6rem;
      background: radial-gradient(circle, #7c3aed 0%, transparent 68%);
    }

    .gpt6-kicker {
      margin: 0 0 1rem;
      color: #67e8f9;
      font: 700 0.76rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .gpt6-page h1 {
      max-width: 42rem;
      margin: 0;
      color: #f8fafc;
      font-size: clamp(2.3rem, 7vw, 4.6rem);
      letter-spacing: -0.045em;
    }

    .gpt6-page .gpt6-subtitle {
      max-width: 38rem;
      margin: 1.2rem 0 0;
      color: #a5b4fc;
      font-size: clamp(1.05rem, 2.5vw, 1.35rem);
    }

    .gpt6-status {
      display: inline-flex;
      align-items: center;
      gap: 0.55rem;
      margin-top: 2.8rem;
      padding: 0.55rem 0.8rem;
      color: #cbd5e1;
      font: 600 0.82rem/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
      border: 1px solid #334155;
      border-radius: 999px;
      background: rgba(15, 23, 42, 0.72);
    }

    .gpt6-status::before {
      width: 0.5rem;
      height: 0.5rem;
      content: "";
      border-radius: 50%;
      background: #22d3ee;
      box-shadow: 0 0 14px #22d3ee;
    }

    .gpt6-note {
      max-width: 32rem;
      margin: 1.5rem 0 0;
      color: #94a3b8;
      font-size: 0.98rem;
    }
  </style>
  <script>
    window.MathJax = {
      tex: {
        inlineMath: [["\\(", "\\)"]],
        displayMath: [["\\[", "\\]"]]
      }
    };
  </script>
  <script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-chtml.js"></script>
</head>
<body class="{% if page.url == '/blogs/cryo-et/' %}cryo-et-theme{% endif %}">
  <nav class="site-nav" aria-label="Main navigation">
    <div class="site-nav-inner">
      <a href="{{ '/' | relative_url }}" data-en="Home" data-zh="主页">Home</a>
      <a href="{{ '/blogs/' | relative_url }}" data-en="Blogs" data-zh="博客">Blogs</a>
      <a href="{{ '/projects/' | relative_url }}" data-en="Web Projects" data-zh="网站项目">Web Projects</a>
      <button id="language-toggle" type="button" aria-label="Switch language">中文</button>
    </div>
  </nav>

  <main class="main-content" role="main">
    {{ content }}
  </main>

  <aside class="floating-toc" aria-label="Table of contents">
    <p class="floating-toc-title" data-en="Contents" data-zh="目录">Contents</p>
    <ul id="floating-toc-list"></ul>
  </aside>

  <script>
    const toggle = document.getElementById("language-toggle");
    const tocList = document.getElementById("floating-toc-list");
    const params = new URLSearchParams(window.location.search);
    let currentLanguage = params.get("lang") === "zh" ? "zh" : "en";

    function slugify(text, index) {
      return `section-${currentLanguage}-${index}-${text
        .trim()
        .toLowerCase()
        .replace(/[^\p{L}\p{N}]+/gu, "-")
        .replace(/^-+|-+$/g, "")}`;
    }

    function rebuildToc() {
      if (!tocList) {
        return;
      }

      tocList.innerHTML = "";
      const activeArticle = document.querySelector(`[data-lang="${currentLanguage}"]`);
      const scope = activeArticle || document.querySelector(".main-content");
      const headings = Array.from(scope.querySelectorAll("h2, h3, h4"));

      headings.forEach((heading, index) => {
        if (!heading.id) {
          heading.id = slugify(heading.textContent, index);
        }

        const item = document.createElement("li");
        item.className = `toc-${heading.tagName.toLowerCase()}`;

        const link = document.createElement("a");
        link.href = `#${heading.id}`;
        link.textContent = heading.textContent;

        item.appendChild(link);
        tocList.appendChild(item);
      });
    }

    function setLanguage(language) {
      currentLanguage = language;
      document.documentElement.lang = currentLanguage === "en" ? "en" : "zh-CN";
      toggle.textContent = currentLanguage === "en" ? "中文" : "English";

      document.querySelectorAll("[data-en][data-zh]").forEach((element) => {
        element.textContent = element.dataset[currentLanguage];
      });

      document.querySelectorAll("[data-lang]").forEach((element) => {
        element.style.display = element.dataset.lang === currentLanguage ? "block" : "none";
      });

      rebuildToc();
    }

    setLanguage(currentLanguage);

    toggle.addEventListener("click", () => {
      setLanguage(currentLanguage === "en" ? "zh" : "en");
    });

    document.querySelectorAll("[data-print-resume]").forEach((button) => {
      button.addEventListener("click", () => {
        window.print();
      });
    });
  </script>
</body>
</html>
