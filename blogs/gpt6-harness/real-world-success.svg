<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc">
  <title id="title">Real-world task success rate</title>
  <desc id="desc">GPT-5.6 has 0 percent success and GPT-6 has 100 percent success in the reported real-world task.</desc>
  <rect width="900" height="470" fill="#f8fafc" rx="20"/>
  <text x="70" y="58" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="700" fill="#0f172a">Real-world task success rate</text>
  <text x="70" y="90" font-family="Arial,Helvetica,sans-serif" font-size="16" fill="#475569">Electronic-component placement under limited camera views</text>
  <line x1="170" y1="370" x2="800" y2="370" stroke="#cbd5e1" stroke-width="2"/>
  <line x1="170" y1="140" x2="170" y2="370" stroke="#cbd5e1" stroke-width="2"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b" text-anchor="end">
    <text x="158" y="375">0%</text><text x="158" y="260">50%</text><text x="158" y="145">100%</text>
  </g>
  <g stroke="#e2e8f0" stroke-width="1"><line x1="170" y1="255" x2="800" y2="255"/><line x1="170" y1="140" x2="800" y2="140"/></g>
  <rect x="270" y="370" width="170" height="0" fill="#ef4444"/>
  <rect x="560" y="140" width="170" height="230" rx="10" fill="#2563eb"/>
  <g font-family="Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="middle"><text x="355" y="410" fill="#0f172a">GPT-5.6</text><text x="645" y="410" fill="#0f172a">GPT-6</text></g>
  <g font-family="Arial,Helvetica,sans-serif" font-size="30" font-weight="800" text-anchor="middle"><text x="355" y="340" fill="#b91c1c">0%</text><text x="645" y="130" fill="#1d4ed8">100%</text></g>
  <text x="70" y="448" font-family="Arial,Helvetica,sans-serif" font-size="14" fill="#64748b">Reported observation; success rate is calculated over the real-world trials shown here.</text>
</svg>
