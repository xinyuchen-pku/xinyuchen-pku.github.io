<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ACL 2026 论文热度浏览与来源核验">
  <title>Paper Signal · ACL 2026</title>
  <link rel="stylesheet" href="./styles.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="./"><span class="brand-mark">PS</span><span>Paper Signal</span></a>
    <div class="topbar-actions">
      <label class="conference-picker"><span>会议</span><select id="conferenceSelect" aria-label="切换会议"></select></label>
      <nav><a href="../projects/">网站项目</a><a href="../">个人主页</a></nav>
    </div>
  </header>
  <main>
    <section class="hero">
      <div><p class="eyebrow"><span id="conferenceEyebrow">PAPER SIGNAL</span> · RESEARCH INTELLIGENCE</p><h1>从论文清单，到可核验的热度排序。</h1><p class="lede">汇集引用、代码采用与社区信号，帮助你快速发现值得关注的会议论文。分数是公开数据的当前观测值，不代表论文质量或同领域百分位。</p></div>
      <div class="hero-stat"><span id="paperCount">—</span><small>收录论文</small></div>
    </section>
    <section class="controls panel" aria-label="论文筛选">
      <label class="search"><span>搜索论文</span><input id="searchInput" type="search" placeholder="标题、作者、DOI 或代码仓库"></label>
      <label><span>排序方式</span><select id="sortSelect"><option value="observed_heat">综合热度</option><option value="academic">学术热度</option><option value="engineering">工程热度</option><option value="community">社区热度</option><option value="citations">引用数</option><option value="title">标题 A–Z</option></select></label>
      <label id="typeFilter"><span>论文类型</span><select id="typeSelect"><option value="all">全部类型</option></select></label>
    </section>
    <section class="results-head"><div><p class="eyebrow">RANKED PAPERS</p><h2>论文热度榜</h2></div><p id="resultSummary" aria-live="polite">正在载入数据…</p></section>
    <section id="paperList" class="paper-list" aria-live="polite"></section>
    <div id="emptyState" class="empty panel hidden"><strong>没有找到匹配的论文</strong><span>尝试更换关键词或筛选条件。</span></div>
    <nav class="pagination" aria-label="分页"><button id="prevBtn">上一页</button><span id="pageInfo"></span><button id="nextBtn">下一页</button></nav>
  </main>
  <footer><span id="snapshotLabel">数据快照</span><span id="footerConference">Paper Signal</span></footer>
  <script src="./app.js" defer></script>
</body>
</html>
